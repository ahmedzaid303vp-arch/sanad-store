<!DOCTYPE html>
<!-- صفحة تواصل معنا: نموذج التواصل ومعلومات الشركة -->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanad Store | تواصل معنا</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="stylesheet" href="assets/css/contact.css">
  <link rel="stylesheet" href="assets/css/common.css?v=20260911">
  <link rel="stylesheet" href="assets/css/theme.css?v=20260910">
  <link rel="stylesheet" href="assets/css/accent.css?v=20260945">
  <link rel="stylesheet" href="assets/css/site-header.css?v=9">
</head>
<body class="page-internal">
  <div id="chrome-top"></div>

  <main class="con-wrap">
    <h1 class="page-t" data-i18n="conTitle">تواصل معنا</h1>
    <div class="con-layout">
      <!-- نموذج التواصل -->
      <form class="con-form" id="conForm">
        <h3 data-i18n="sendMsg">أرسل لنا رسالة</h3>
        <div class="field"><label data-i18n="cName">الاسم</label><input type="text" id="cName" required maxlength="120"></div>
        <div class="field"><label data-i18n="cEmail">البريد الإلكتروني</label><input type="email" id="cEmail" required maxlength="254"></div>
        <div class="field"><label data-i18n="cSubj">الموضوع</label><input type="text" id="cSubj" required maxlength="160"></div>
        <div class="field"><label data-i18n="cMsg">الرسالة</label><textarea id="cMsg" rows="5" required maxlength="2000"></textarea></div>
        <button type="submit" class="btn" data-i18n="sendBtn">إرسال الرسالة</button>
      </form>

      <!-- معلومات التواصل -->
      <aside class="con-info">
        <h3 data-i18n="getInTouch">تواصل مباشرة</h3>
        <div class="info-card"><span>📞</span><div><b data-i18n="callUs">اتصل بنا</b><p><a href="tel:01107859933" dir="ltr">01107859933</a></p></div></div>
        <div class="info-card"><span>✉️</span><div><b data-i18n="emailUs">البريد الإلكتروني</b><p>info@anaqa.com</p></div></div>
        <div class="info-card"><span>📍</span><div><b data-i18n="visitUs">العنوان</b><p data-i18n="addrVal">القاهرة، مصر</p></div></div>
        <div class="info-card"><span>⏰</span><div><b data-i18n="workHrs">ساعات العمل</b><p data-i18n="hrsVal">السبت - الخميس: 9 ص - 9 م</p></div></div>
      </aside>
    </div>
  </main>

  <div id="chrome-bottom"></div>
  <script src="assets/js/data-safety.js?v=20260927"></script>
  <script src="assets/js/page-bootstrap.js?v=20260938" data-page="contact"></script>
</body>
</html>
