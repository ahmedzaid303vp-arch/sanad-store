<!DOCTYPE html>
<!-- صفحة إتمام الطلب: بيانات الشحن وتأكيد الطلب -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanad Store | إتمام الطلب</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="stylesheet" href="assets/css/checkout.css">
  <link rel="stylesheet" href="assets/css/common.css?v=20260911">
  <link rel="stylesheet" href="assets/css/theme.css?v=20260910">
  <link rel="stylesheet" href="assets/css/accent.css?v=20260945">
  <link rel="stylesheet" href="assets/css/site-header.css?v=5">
</head>
<body class="page-internal">
  <div id="chrome-top"></div>

  <main class="chk-wrap">
    <h1 class="page-t" data-i18n="chkTitle">إتمام الطلب</h1>
    <div class="chk-layout">
      <!-- نموذج بيانات الشحن -->
      <form class="chk-form" id="chkForm">
        <h3 data-i18n="shipInfo">بيانات الشحن</h3>
        <div class="form-grid">
          <div class="field"><label data-i18n="fName">الاسم بالكامل</label><input type="text" id="fName" required maxlength="120"></div>
          <div class="field"><label data-i18n="fPhone">رقم الموبايل</label><input type="tel" id="fPhone" required pattern="[0-9]{11}" maxlength="11"></div>
          <div class="field"><label data-i18n="fGov">المحافظة</label><input type="text" id="fGov" required maxlength="80"></div>
          <div class="field"><label data-i18n="fCity">المدينة / المركز</label><input type="text" id="fCity" required maxlength="100"></div>
        </div>
        <div class="field full"><label data-i18n="fAddr">العنوان بالتفصيل</label><textarea id="fAddr" rows="3" required maxlength="300"></textarea></div>
        <div class="field full"><label data-i18n="fNotes">ملاحظات (اختياري)</label><textarea id="fNotes" rows="2" maxlength="500"></textarea></div>
        
        <h3 style="margin-top:20px" data-i18n="payMeth">طريقة الدفع</h3>
        <div class="pay-opt">
          <input type="radio" name="pay" id="cod" checked>
          <label for="cod" data-i18n="cod">الدفع عند الاستلام (Cash on Delivery)</label>
        </div>
        
        <button type="submit" class="btn" id="placeBtn" data-i18n="placeOrder">تأكيد الطلب</button>
      </form>

      <!-- ملخص الطلب -->
      <aside class="chk-summary" id="chkSummary"></aside>
    </div>
  </main>

  <div id="chrome-bottom"></div>
  <script src="assets/js/data-safety.js?v=20260927"></script>
  <script src="assets/js/appwrite-client.js?v=20260928"></script>
  <script src="assets/js/page-bootstrap.js?v=20260934" data-page="checkout"></script>
</body>
</html>
